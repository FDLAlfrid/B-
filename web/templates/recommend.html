<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能推荐 - 智能音乐推荐系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="recommend-page">
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <span class="logo">🎵</span>
                <span class="brand-name">智能音乐推荐</span>
            </div>
            <div class="navbar-links">
                <a href="/" class="nav-link">首页</a>
                <a href="/recommend" class="nav-link active">推荐</a>
                <a href="/login" class="nav-link" id="login-link">登录</a>
                <span id="user-info" style="display: none; color: #fff; margin-left: 10px;"></span>
                <button id="logout-btn" style="display: none; margin-left: 10px; padding: 5px 10px; background: #e94560; border: none; color: #fff; border-radius: 4px; cursor: pointer;">
                    退出登录
                </button>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container">
        <div class="page-header">
            <h1>🎵 猜你喜欢</h1>
            <p id="recommend-desc">为你精选热门音乐推荐</p>
            <button id="refresh-btn" class="refresh-btn">🔄 刷新推荐</button>
        </div>
        
        <!-- 搜索框 -->
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="搜索音乐..." class="search-input">
            <button id="search-btn" class="search-btn">搜索</button>
        </div>
        
        <!-- 视频网格 -->
        <div class="video-grid" id="recommendations">
            <!-- 动态加载推荐内容 -->
        </div>
        
        <!-- 加载提示 -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>正在获取推荐...</p>
        </div>
    </main>

    <!-- 视频详情弹窗 -->
    <div id="video-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="video-detail"></div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 智能音乐推荐系统. 保留所有权利.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/recommend.js') }}"></script>
</body>
</html>
